name: Practical 2 - Student Result ML CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-test:
    name: Train and Test Student Result Model
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Practical-2-Student-Result-ML-CI

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train student result model
        run: python train_model.py

      - name: Run automated ML tests
        run: python -m unittest discover -s . -p "test*.py" -v

      - name: Upload model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: student-result-ml-artifacts
          path: |
            Practical-2-Student-Result-ML-CI/student_result_model.pkl
            Practical-2-Student-Result-ML-CI/metrics.json
            Practical-2-Student-Result-ML-CI/student_results.csv
          if-no-files-found: warn
