name: Practical 9 - Docker GHCR CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'Practical-6-Dockerize-ML-Prediction-Application/**'
      - '.github/workflows/practical-9-ghcr-docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./Practical-6-Dockerize-ML-Prediction-Application
          push: true
          tags: |
            ghcr.io/gurram-nandhini/student-result-ml:latest
            ghcr.io/gurram-nandhini/student-result-ml:1.2