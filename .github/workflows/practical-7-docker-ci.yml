name: Practical 7 - Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Practical 5 dependencies
        working-directory: Practical-5-Continuous-Delivery
        run: pip install -r requirements.txt

      - name: Train student result model
        working-directory: Practical-5-Continuous-Delivery
        run: python train_model.py

      - name: Check ML quality gate
        working-directory: Practical-5-Continuous-Delivery
        run: python quality_gate.py

      - name: Run automated tests
        working-directory: Practical-5-Continuous-Delivery
        run: python -m unittest discover -v

      - name: Copy trained model to Practical 6
        run: |
          cp Practical-5-Continuous-Delivery/student_result_model.pkl Practical-6-Dockerize-ML-Prediction-Application/student_result_model.pkl

      - name: Build Docker image
        working-directory: Practical-6-Dockerize-ML-Prediction-Application
        run: docker build -t student-result-ml:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name student-result-ml-container \
            -p 5000:5000 \
            student-result-ml:${{ github.sha }}

      - name: Wait for application to become ready
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done

          echo "Application did not become ready."
          docker logs student-result-ml-container
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"attendance":90,"internal_marks":85,"assignment_marks":88,"previous_score":80}' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'

      - name: Show Docker container logs
        if: always()
        run: docker logs student-result-ml-container || true

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f student-result-ml-container || true